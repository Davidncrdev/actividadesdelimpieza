<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias por tu Solicitud | Actividades de Limpieza</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,rgba(16,185,129,.05),rgba(16,185,129,.1));padding:20px}
    :root{--primary:#10b981;--primary-dark:#059669;--dark:#1e293b;--gray:#64748b;--white:#fff}
    .card{background:var(--white);max-width:500px;padding:60px 40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.1);text-align:center}
    .check-icon{width:80px;height:80px;background:var(--primary);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
    .check-icon i{color:var(--white);font-size:2.5rem}
    h1{font-size:2rem;color:var(--dark);margin-bottom:12px}
    p{color:var(--gray);font-size:1.1rem;margin-bottom:30px;line-height:1.6}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:var(--primary);color:var(--white);border:none;border-radius:8px;font-weight:600;font-size:1rem;text-decoration:none;transition:all .3s ease;box-shadow:0 4px 6px -1px rgba(16,185,129,.3)}
    .btn:hover{background:var(--primary-dark);transform:translateY(-2px)}
    .btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);box-shadow:none;margin-left:12px}
    .btn-outline:hover{background:rgba(16,185,129,.05)}
    @media(max-width:480px){.card{padding:40px 24px}}
  </style>
</head>
<body>
  <div class="card">
    <div class="check-icon">
      <i class="fas fa-check"></i>
    </div>
    <h1>¡Gracias por confiar en nosotros!</h1>
    <p>Hemos recibido tu solicitud correctamente. Nuestro equipo se pondrá en contacto contigo en menos de <strong>24 horas</strong> para ofrecerte el mejor presupuesto personalizado.</p>
    <div>
      <a href="index.html" class="btn"><i class="fas fa-home"></i> Volver al inicio</a>
      <a href="servicios.html" class="btn btn-outline">Ver servicios</a>
    </div>
  </div>
</body>
</html>
